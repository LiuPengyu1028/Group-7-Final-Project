[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-accident-risk-dashboard"
version = "0.1.0"
description = "Data preparation for a course demonstration dashboard of historical US accident severity."
requires-python = ">=3.11,<3.13"
dependencies = ["pandas>=2.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
